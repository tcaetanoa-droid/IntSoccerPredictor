# FIFA World Cup 2026 — 11 Jun to 19 Jul 2026, hosts United States, Canada, Mexico.
# Groups were inferred from who played whom in the group stage (eloratings.net histories).
# Group LETTERS come from the 5 Dec 2025 draw (pot-1 seeds: MX=A, CA=B, BR=C, US=D, DE=E,
# NL=F, BE=G, ES=H, FR=I, AR=J, PT=K, EN=L) — verify. Actual results: wc2026_results.csv.
name: FIFA World Cup 2026
match_type: WC          # -> K = 60
tiebreakers: head_to_head_first   # 2026 rule: a-c head-to-head, then overall GD, GF
start_date: 2026-06-11
ratings_snapshot: data/snapshots/2026-06-10_wc2026.csv
past_champions:         # World Cup titles BEFORE this tournament (for the report views)
  'UY': 2
  'IT': 4               # not in the 2026 field
  'DE': 4
  'BR': 5
  'EN': 1
  'AR': 3
  'FR': 2
  'ES': 1
hosts:                  # team code -> venue country code where they get +100 home advantage
  'US': 'US'
  'CA': 'CA'
  'MX': 'MX'
groups:
  A: ['MX', 'KR', 'CZ', 'ZA']   # Mexico, South Korea, Czechia, South Africa
  B: ['CH', 'CA', 'BA', 'QA']   # Switzerland, Canada, Bosnia and Herzegovina, Qatar
  C: ['BR', 'MA', 'SQ', 'HT']   # Brazil, Morocco, Scotland, Haiti
  D: ['TR', 'PY', 'AU', 'US']   # Turkey, Paraguay, Australia, United States
  E: ['EC', 'DE', 'CI', 'CW']   # Ecuador, Germany, Ivory Coast, Curaçao
  F: ['NL', 'JP', 'SE', 'TN']   # Netherlands, Japan, Sweden, Tunisia
  G: ['BE', 'IR', 'EG', 'NZ']   # Belgium, Iran, Egypt, New Zealand
  H: ['ES', 'UY', 'CV', 'SA']   # Spain, Uruguay, Cape Verde, Saudi Arabia
  I: ['FR', 'NO', 'SN', 'IQ']   # France, Norway, Senegal, Iraq
  J: ['AR', 'AT', 'DZ', 'JO']   # Argentina, Austria, Algeria, Jordan
  K: ['PT', 'CO', 'UZ', 'CD']   # Portugal, Colombia, Uzbekistan, DR Congo
  L: ['EN', 'HR', 'PA', 'GH']   # England, Croatia, Panama, Ghana
advance:
  top_n: 2
  best_thirds: 8
knockout:
  # Full bracket, tiebreakers and the 495-row third-place table: docs/WC2026_FORMAT.md.
  # Slot notation: 1A/2A = group position, 3:ABCDF = third-placed team from one of those groups
  # (resolved via wc2026_third_place_table.csv), W74 / L101 = winner / loser of match 74 / 101.
  third_place_table: data/tournaments/wc2026_third_place_table.csv
  extra_time_and_penalties: true
  # Country hosting each knockout match, from the real 2026 schedule (wc2026_results.csv). A host
  # playing in its own country gets +100 (docs/WC2026_FORMAT.md section 5). Hosts play all their
  # group matches at home, so group venues are not listed.
  venues:
    73: 'US'
    74: 'US'
    75: 'MX'
    76: 'US'
    77: 'US'
    78: 'US'
    79: 'MX'
    80: 'US'
    81: 'US'
    82: 'US'
    83: 'CA'
    84: 'US'
    85: 'CA'
    86: 'US'
    87: 'US'
    88: 'US'
    89: 'US'
    90: 'US'
    91: 'US'
    92: 'MX'
    93: 'US'
    94: 'US'
    95: 'US'
    96: 'CA'
    97: 'US'
    98: 'US'
    99: 'US'
    100: 'US'
